server:
  port: 8080

spring:
  application:
    name: pulse-backend
  datasource:
    url: ${PULSE_DB_URL:jdbc:mysql://localhost:3306/pulse}
    username: ${PULSE_DB_USER:root}
    password: ${PULSE_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

pulse:
  jwt:
    secret: ${PULSE_JWT_SECRET:change-me-to-a-long-random-string-later}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${PULSE_CORS_ORIGINS:http://localhost:4200}
