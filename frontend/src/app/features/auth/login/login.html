<div class="auth-layout">
  <section class="auth-visual">
    <div class="auth-visual__overlay">
      <span class="auth-visual__eyebrow">Pick up where You Left Off</span>
      <h2 class="auth-visual__title">Váš tréningový plán<br/>začína tu</h2>
      <div class="auth-visual__stats">
      <div class="stat">
        <span class="stat__label">SPORT</span>
        <span class="stat__value">8 ŠPORTOV</span>
      </div>
      <div class="stat">
        <span class="stat__label">ÚROVEŇ</span>
        <span class="stat__value">3 ÚROVNE</span>
      </div>
      <div class="stat">
        <span class="stat__label">PLÁN</span>
        <span class="stat__value stat__value--accent">AŽ 12 TÝŽDŇOV</span>
      </div>
 </div>
</div>
</section>
<section class="auth-form-panel">
  <div class="auth-form-inner">
    <span class="auth-eyebrow">PRIHLÁSENIE</span>
    <h1 class="auth-title">Vitaj späť</h1>
    <form class="auth-form" [formGroup]="form" (ngSubmit)="OnSubmit()">
      <label class="field">
        <span class="field__label">EMAIL</span>
        <input class="field__input" type="email" formControlName="email" placeholder="you@gmail.com"/>
      </label>
      <label class="field">
        <span class="field__label">HESLO</span>
        <input class="field__input" type="password" formControlName="password" />
      </label>
      @if (errorMessage()) {
        <p class="form-error">{{errorMessage()}}</p>
      }
      <button class="btn btn--primary btn--block" type="submit" [disabled]="form.invalid || submitting()">
        PRIHLÁSIŤ SA <span class="btn__arrow">&rarr;</span>
      </button>
    </form>
    <p class="auth-footer">
      Ešte nemáš účet? <a routerLink="/register">ZAREGISTRUJ SA</a>
    </p>
  </div>
</section>
