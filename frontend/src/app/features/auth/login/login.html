<div class="auth-layout">
  <section class="auth-visual">
    <div class="auth-visual__overlay">
      <span class="auth-visual__eyebrow">Pick up where You Left Off</span>
      <h2 class="auth-visual_title">Week 6<br/>of twelve</h2>
      <div class="auth-visual__stats">
      <div class="stat">
        <span class="stat__lable">SPORT</span>
        <span class="stat__value">FOOTBALL</span>
      </div>
      <div class="stat">
        <span class="stat__lable">Level</span>
        <span class="stat__value">ADVANCED</span>
      </div>
      <div class="stat">
        <span class="stat__lable">STREAK</span>
        <span class="stat__value stat__value--accent">12 DAYS</span>
      </div>
 </div>
</div>
</section>
<section class="auth-form-panel">
  <div class="auth-form-inner">
    <span class="auth-eyebrow">SIGN IN</span>
    <h1 class="auth-title">Welcome back</h1>
    <form class="auth-form" [formGroup]="form" (ngSubmit) ="OnSubmit()">
      <label class="field">
        <span class="field__label">EMAIL</span>
        <input class="field__input" type="email"fromControlName="email"placeholder="you@gmail.com"/>
      </label>
      <label class="field">
        <span class="field_label">PASSWORD</span>
        <input class="field__input" type="password" formControlName ="password"/>
      </label>
      @if (errorMessage) {
        <p class="form-error">{{errorMessage}}</p>
      }
      <button class="btn btn--primary btn--block" type="submit"[disabled]="form.invalid">
        SIGN IN<span class="btn__arrow"></span>
      </button>
    </form>
    <p class="auth-footer">
      Don't have plan yet?<a routerLink="/register">CREATE ACCOUNT</a>
    </p>
  </div>
</section>
