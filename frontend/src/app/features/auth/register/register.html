<div class="auth-layout">
  <section class="auth-form-panel">
    <div class="auth-form-inner">
      <span class="auth-eyebrow">KROK 1 Z 3 &middot; ÚČET</span>
      <h1 class="auth-title">Vytvor si účet</h1>
      <div class="steps">
        <span class="step step--active">ÚČET</span>
        <span class="step">PROFIL</span>
        <span class="step">PLÁN</span>
      </div>
      <form class="auth-form" [formGroup]="form" (ngSubmit)="OnSubmit()">
        <div class="field-row">
          <label class="field">
            <span class="field__label">MENO</span>
            <input class="field__input" type="text" formControlName="firstName" />
          </label>
          <label class="field">
            <span class="field__label">PRIEZVISKO</span>
            <input class="field__input" type="text" formControlName="lastName" />
          </label>
        </div>

        <label class="field">
          <span class="field__label">EMAIL</span>
          <input class="field__input" type="email" formControlName="email" placeholder="you@gmail.com" />
        </label>
        <label class="field">
          <span class="field__label">HESLO</span>
          <input
            class="field__input"
            type="password"
            formControlName="password"
            placeholder="At least 8 characters"
          />
        </label>
        @if (errorMessage()) {
          <p class="form-error">{{ errorMessage() }}</p>
        }
        <button
          class="btn btn--primary btn--block"
          type="submit"
          [disabled]="form.invalid || submitting()"
        >
          POKRAČOVAŤ NA PROFIL <span class="btn__arrow">&rarr;</span>
        </button>
      </form>
      <p class="auth-footer">
        Už máš účet? <a routerLink="/login">PRIHLÁSIŤ SA</a>
      </p>
    </div>
  </section>
</div>
<section class="auth-visual">
  <div class="auth-visual__overlay">
    <span class="auth-visual__eyebrow">PULSE</span>
    <h2 class="auth-visual__title">8 športov, 3 úrovne, jeden plán</h2>
    <div class="auth-visual__stats">
      <div class="stat">
        <span class="stat__label">TRENING</span>
        <span class="stat__value">Podľa športu</span>
      </div>
      <div class="stat">
        <span class="stat__label">VÝŽIVA</span>
        <span class="stat__value">Podľa záťaže</span>
      </div>
    </div>
  </div>
</section>
