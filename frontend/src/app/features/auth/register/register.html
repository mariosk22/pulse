<div class="auth-layout">
  <section class="auth-form-panel">
    <div class="auth-form-inner">
      <span class="auth-eyebrow">STEP 1 OF 3 &middot; ACCOUNT</span>
      <h1 class="auth-title">Create your account</h1>
      <div class="steps">
        <span class="step step--active">ACCOUNT</span>
        <span class="step">PROFILE</span>
        <span class="step">PLAN</span>
      </div>
      <form class="auth-form" [formGroup]="form" (ngSubmit)="OnSubmit()">
        <div class="field-row">
          <label class="field">
            <span class="field__label">FIRST NAME</span>
            <input class="field__input" type="text" formControlName="firstName" />
          </label>
          <label class="field">
            <span class="field__label">LAST NAME</span>
            <input class="field__input" type="text" formControlName="lastName" />
          </label>
        </div>

        <label class="field">
          <span class="field__label">EMAIL</span>
          <input class="field__input" type="email" formControlName="email" placeholder="you@gmail.com" />
        </label>
        <label class="field">
          <span class="field__label">PASSWORD</span>
          <input
            class="field__input"
            type="password"
            formControlName="password"
            placeholder="At least 8 characters"
          />
        </label>
        @if (errorMessage()) {
          <p class="form-error">{{ errorMessage() }}</p>
        }
        <button
          class="btn btn--primary btn--block"
          type="submit"
          [disabled]="form.invalid || submitting()"
        >
          CONTINUE TO PROFILE <span class="btn__arrow">&rarr;</span>
        </button>
      </form>
      <p class="auth-footer">
        Already have an account? <a routerLink="/login">LOG IN</a>
      </p>
    </div>
  </section>
</div>
<section class="auth-visual">
  <div class="auth-visual__overlay">
    <span class="auth-visual__eyebrow">PULSE</span>
    <h2 class="auth-visual__title">8 sports, 3 levels, one plan</h2>
    <div class="auth-visual__stats">
      <div class="stat">
        <span class="stat__label">TRAINING</span>
        <span class="stat__value">Based on sport</span>
      </div>
      <div class="stat">
        <span class="stat__label">NUTRITION</span>
        <span class="stat__value">Based on load</span>
      </div>
    </div>
  </div>
</section>
