<div class="shell">
  <header class="shell__bar">
    <a class="shell__brand" routerLink="/dashboard">PULSE</a>
    <nav class="shell__nav">
      @for (item of navItems; track item.path) {
        <a class="shell__link" [routerLink]="item.path" routerLinkActive="shell__link--active">
          {{ item.label }}
        </a>
      }
    </nav>
    <div class="shell__user">
      @if (user(); as current) {
        <span class="shell__name">{{ current.fullName }}</span>
      }
      <button class="shell__logout" type="button" (click)="onLogout()">ODHLÁSIŤ</button>
    </div>
  </header>
  <main class="shell__main">
    <ng-content />
  </main>
</div>
